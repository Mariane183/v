<ion-content class="ion-padding">
  <ion-grid class="ion-justify-content-center ion-align-items-center">
    <ion-col size="12" size-sm="8" size-md="6" size-lg="4">
      
      <div class="login-container">
        <form (ngSubmit)="onLogin()">
         
          <ion-item lines="solid">
            <ion-input 
              label="Username" 
              labelPlacement="floating" 
              type="text" 
              [ngModel]="credentials().username" 
              (ngModelChange)="credentials.update(c => ({ ...c, username: $event }))"
              name="loginInput" 
              required 
              placeholder="Enter username">
            </ion-input>
          </ion-item>

          <ion-item lines="solid">
            <ion-input 
              label="Password" 
              labelPlacement="floating" 
              type="password" 
              [ngModel]="credentials().password" 
              (ngModelChange)="credentials.update(c => ({ ...c, password: $event }))"
              name="password" 
              required 
              placeholder="Enter your password">
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
          </ion-item>

          <ion-button expand="block" type="submit" class="ion-margin-top">
            Login
          </ion-button>

        </form>
      </div>

    </ion-col>
  </ion-grid>
</ion-content>
